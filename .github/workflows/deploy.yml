# The site is hand-written static HTML: there is nothing to build. This workflow
# just uploads the repository as-is and hands it to Pages.
#
# It replaces the Hugo Blox workflow that used to live here, which ran
# `hugo --minify` and would now fail — there is no hugoblox.yaml and no
# content/ directory any more.
#
# DISARMED ON PURPOSE. The site is not meant to go online yet, so the automatic
# `push` trigger is commented out and this workflow only runs when someone
# starts it by hand from the Actions tab. Nothing gets published by pushing.
#
# To go live: uncomment the two `push` lines below, make the repository public
# (Pages does not serve a private repo on a free plan) and set
# Settings -> Pages -> Source to "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  # push:
  #   branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it half-published
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload the site as-is
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
