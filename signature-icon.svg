<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Mariagiulia Martinelli">
  <!-- Email-signature variant of the brand mark: same double helix as favicon.svg,
       but the strands are thicker and fill more of the tile, and the four ladder
       rungs are dropped — at 20 px they collapse into the crossings and muddy it.
       signature-icon.png / signature-icon-20.png are rendered from this. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7ad0"/>
      <stop offset="1" stop-color="#4a3f6e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-width="4.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 13C21 21.4 43 25.7 43 32C43 38.3 21 42.6 21 51"/>
    <path d="M43 13C43 21.4 21 25.7 21 32C21 38.3 43 42.6 43 51"/>
  </g>
</svg>
